[package]
name = "astro-core"
description = "Astronomical calculations and astrological rules for Astrologiprogrammet. No UI, no Tauri."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
tzdb = "0.7"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
cc = "1"
