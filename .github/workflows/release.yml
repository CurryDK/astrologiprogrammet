name: Release

# Pushing a tag like v0.0.2 builds the Windows installer, signs the update
# and publishes both as a GitHub release. Installed copies pick it up from
# the release's latest.json on next start.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # The app crate embeds the built interface, so it must exist before cargo compiles it.
      - run: pnpm build

      - run: cargo test --workspace

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Astrologiprogrammet ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
